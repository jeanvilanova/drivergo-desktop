name: Build & Release

# Dispara quando você criar uma tag do tipo v1.0.0, v1.2.3, etc.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # necessário para criar o Release

jobs:
  build-windows:
    name: Build MSI (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Baixa os binários do WiX 3.14 diretamente do GitHub (sem Chocolatey)
      - name: Instalar WiX Toolset v3.14
        run: |
          $url = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
          $zip = "$env:TEMP\wix314-binaries.zip"
          $dir = "C:\wix314"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          echo "$dir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "WiX instalado em $dir"
        shell: powershell

      - name: Instalar dependências npm
        run: npm ci

      - name: Gerar instalador MSI
        run: npm run make

      # Renomeia para nome fixo — assim a URL de download da landing page
      # nunca muda entre versões (sempre DriveGo-Setup.msi)
      - name: Renomear MSI para nome fixo
        run: |
          $src = Get-ChildItem "out\make\wix\x64\*.msi" | Select-Object -First 1
          Copy-Item $src.FullName "out\make\wix\x64\DriveGo-Setup.msi"
        shell: powershell

      - name: Publicar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: "DriveGo ${{ github.ref_name }}"
          generate_release_notes: true
          files: out/make/wix/x64/DriveGo-Setup.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
